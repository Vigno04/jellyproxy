services:
  jellyproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyproxy
    restart: unless-stopped
    network_mode: container:gerbil
    environment:
      - PORT=8096
      - UPSTREAM_URL=https://100.89.128.4:52905
      - UPSTREAM_HOST=jellyfin.vigno.eu
      - SHARED_SECRET=jellyproxy_secret_key_vigno
      - CACHE_DIR=/var/cache/jellyproxy
      - LOG_LEVEL=info
    volumes:
      - jellyproxy_cache:/var/cache/jellyproxy

volumes:
  jellyproxy_cache:
    driver: local
