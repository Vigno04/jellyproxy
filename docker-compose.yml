services:
  jellyproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyproxy
    restart: unless-stopped
    network_mode: container:gerbil
    environment:
      - PORT=8096
      - UPSTREAM_URL=http://198.51.100.10:50271
      - UPSTREAM_HOST=jellyfin.example.com
      - SHARED_SECRET=replace-me-shared-secret
      - CACHE_DIR=/var/cache/jellyproxy
      - LOG_LEVEL=info
    volumes:
      - jellyproxy_cache:/var/cache/jellyproxy

volumes:
  jellyproxy_cache:
    driver: local
