services:
  jellyproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyproxy
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - PORT=8096
      - UPSTREAM_URL=https://jellyfin.vigno.eu
      - SHARED_SECRET=jellyproxy_secret_key_vigno
      - CACHE_DIR=/var/cache/jellyproxy
      - LOG_LEVEL=info
    networks:
      - default
      - pangolin
    volumes:
      - jellyproxy_cache:/var/cache/jellyproxy

networks:
  default:
  pangolin:
    external: true

volumes:
  jellyproxy_cache:
    driver: local
