name: Build & Test Proxy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'proxy/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/build-proxy.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Go Proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: proxy/go.sum

      - name: Build Proxy Binary
        working-directory: ./proxy
        run: |
          go build -v -o jellyproxy ./cmd/jellyproxy

      - name: Build Docker Image
        run: |
          docker build -t jellyproxy:latest .
