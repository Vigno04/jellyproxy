name: Build Plugin

on:
  push:
    branches: [ "main" ]
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build .NET Jellyfin Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build Plugin
        working-directory: ./plugin/JellyProxy
        run: |
          dotnet build -c Release
